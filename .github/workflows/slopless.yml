# Static analysis for AI-slop patterns: https://github.com/fabriziosalmi/slopless
#
# The trial is over: the errors it found are fixed, so errors now fail the build.
# Warnings still only report. Findings go to the Security tab either way.
name: slopless

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyse:
    name: AI-slop static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned to a commit rather than @v1: a moving tag means trusting the
      # upstream repository not to change under us.
      - name: Run slopless
        uses: fabriziosalmi/slopless@fae72fa3497882376bac2b26ef9b425cacbedbb0 # v1.5.0
        with:
          # vendor/ holds Bootstrap and Font Awesome. slopless skips minified
          # output on its own, and this keeps it from reading it at all.
          patterns: "script.js styles.css *.md"
          format: sarif
          output: slopless.sarif

      # A fork pull request gets a read-only token whatever `permissions:` says,
      # so the upload would 403 and fail the job it promises not to fail.
      - name: Upload findings to code scanning
        if: >-
          always()
          && hashFiles('slopless.sarif') != ''
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          sarif_file: slopless.sarif
          category: slopless
